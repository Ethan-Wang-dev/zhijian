<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>值见</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand">值见</div>
    <div class="tagline">每半小时，找到真正值得看的内容</div>
    <div id="status" class="status">正在读取状态…</div>
    <div id="results" class="results"></div>
    <button id="dashboard" class="secondary">打开完整结果面板</button>
    <button id="refresh">立即扫描全部配置源</button>
    <button id="analyze" class="secondary">分析当前 X 搜索页 / 账号页</button>
    <button id="options" class="secondary">打开设置</button>
    <p class="note">自动扫描不要求停留在 X 页面。手动分析只根据当前 X 搜索页或公开账号页的 URL，通过外部只读 API 分页获取更多内容；不会读取 DOM、登录态或个性化首页。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
