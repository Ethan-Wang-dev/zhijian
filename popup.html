<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>值见</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand">值见</div>
    <div class="tagline">每半小时，找到真正值得看的内容</div>
    <div id="status" class="status">正在读取状态…</div>
    <div id="results" class="results"></div>
    <button id="dashboard" class="secondary">打开完整结果面板</button>
    <button id="refresh">立即扫描全部配置源</button>
    <button id="analyze" class="secondary">只分析当前 X 页面</button>
    <button id="options" class="secondary">打开设置</button>
    <p class="note">自动扫描会读取指定 X 账号、主题搜索和 RSS/Atom，并交给你配置的 LLM 统一判断。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
